  viewBox="0 0 100 100"
>
  <!-- Vintage cream background -->
  <rect
    width="100"
    height="100"
    rx="22"
    fill="#F7F0E5"
  />

  <!-- Outer burgundy frame -->
  <rect
    x="8"
    y="8"
    width="84"
    height="84"
    rx="18"
