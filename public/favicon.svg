  />

  <!-- Left book -->
  <path
    d="M20 22
       C31 18 40 21 49 28
       V78
       C40 71 31 69 20 73
       Z"
    fill="#743746"
  />

  <!-- Right book -->
  <path
    d="M51 28
       C60 21 69 18 80 22
       V73
       C69 69 60 71 51 78
       Z"
    fill="#8D4A59"
  />

  <!-- Book spine -->
  <path
    d="M49 28
       C50 27 50 27 51 28
       V78
       C50 77 50 77 49 78
       Z"
    fill="#C09A58"
  />

  <!-- Decorative gold line -->
  <path
    d="M28 34
       C34 31 40 33 45 36"
    fill="none"
    stroke="#D6B878"
    stroke-width="2"
    stroke-linecap="round"
  />

  <path
    d="M55 36
       C60 33 66 31 72 34"
    fill="none"
    stroke="#D6B878"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Small gold ornament -->
  <circle
    cx="50"
    cy="84"
    r="3"
    fill="#B58A4A"
  />
